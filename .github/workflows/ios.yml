name: iOS build and upload to TestFlight
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: com.reshyapps.saydaliati
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci
      - run: npm run build
      - run: npx cap add ios

      - name: Info.plist and version
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'تستخدم الكاميرا لمسح باركود الأدوية'" $P
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'لاختيار ملفات النسخ الاحتياطي'" $P
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 1.0;/' ios/App/App.xcodeproj/project.pbxproj
      - run: npx cap sync ios

      - name: Install App Store Connect API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive (automatic signing via API key)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID archive

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/out -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f $RUNNER_TEMP/out/App.ipa -t ios \
            --apiKey $KEY_ID --apiIssuer $ISSUER_ID

      - uses: actions/upload-artifact@v4
        with:
          name: saydaliati-ios-ipa
          path: ${{ runner.temp }}/out/App.ipa
