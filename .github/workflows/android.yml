name: Android build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Generate app icons
        run: npx --yes @capacitor/assets generate --android
      - name: Permissions and version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />|' $M
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
      - run: npx cap sync android

      - name: Build debug APK (for testing on your phone)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Sign AAB with upload key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "No keystore secret: skipping signing"; exit 0; fi
          echo "$KS" | base64 -d > /tmp/upload.jks
          jarsigner -keystore /tmp/upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          echo "signed=1" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: saydaliati-android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: saydaliati-android-aab${{ env.signed == '1' && '-signed' || '-UNSIGNED' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
