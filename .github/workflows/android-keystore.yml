name: Create Android upload key (run ONCE)
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Password for the key (6+ chars, letters/digits only)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          PW: ${{ inputs.password }}
        run: |
          keytool -genkeypair -v -keystore upload.jks -storetype JKS -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Reshy Apps, O=Reshy Apps, C=GB"
          base64 -w0 upload.jks > upload.jks.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KEEP-PRIVATE-android-upload-key
          path: |
            upload.jks
            upload.jks.base64.txt
